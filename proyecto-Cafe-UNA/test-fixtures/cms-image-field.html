<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; img-src 'self' blob: data:; font-src 'self' data:" />
    <title>CMS image field local fixture</title>
    <style>body { background: #f8fafc; } html.dark body { background: #0f172a; }</style>
  </head>
  <body class="bg-slate-50 p-4 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <main id="root" class="mx-auto max-w-xl"></main>
    <script type="module">
      import React, { useState } from "react";
      import { createRoot } from "react-dom/client";
      import { CmsImageField } from "/src/Components/ui/CmsImageField.jsx";
      import "/src/index.css";

      function Fixture() {
        const [value, setValue] = useState("");
        const [uploading, setUploading] = useState(false);
        const subir = async (file) => {
          await new Promise((resolve) => setTimeout(resolve, 350));
          return URL.createObjectURL(file);
        };
        return React.createElement("section", { className: "grid gap-4" },
          React.createElement("h1", null, "Campo de imagen CMS: prueba local"),
          React.createElement(CmsImageField, {
            label: "Imagen de portada", value, onChange: setValue, subir, onUploadingChange: setUploading,
          }),
          React.createElement("output", { "aria-live": "polite" }, uploading ? "Carga en curso" : value || "Sin imagen"),
          React.createElement("button", { onClick: () => document.documentElement.classList.toggle("dark") }, "Alternar tema"),
        );
      }
      createRoot(document.getElementById("root")).render(React.createElement(Fixture));
    </script>
  </body>
</html>
